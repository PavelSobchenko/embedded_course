; PlatformIO Project Configuration File
;
; Кожен урок / домашка — окрема папка в src/ зі своїм main.cpp
; і окремий env нижче, який компілює тільки цю папку.
;
; Щоб додати новий урок:
;   1. створи src/<папка>/main.cpp
;   2. додай env (назва env: тільки a-z, 0-9, -, _ — крапки не можна):
;        [env:module1_4]
;        build_src_filter = +<module1.4/>
;   3. (опційно) зміни default_envs, щоб Build/Upload брали його за замовчуванням
;
; Запуск з терміналу:  pio run -e module1_3 -t upload -t monitor

[platformio]
default_envs = module1_3

; Спільні налаштування для всіх уроків (успадковуються кожним env)
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ---------- Уроки ----------

[env:module1_3]
build_src_filter = +<module1.3/>

[env:module1_4]
build_src_filter = +<module1.4/>

[env:module1_5]
build_src_filter = +<module1.5/>

[env:module1_6]
build_src_filter = +<module1.6/>